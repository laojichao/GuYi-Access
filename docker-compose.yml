# GuYi Access Pro - MySQL + backend + frontend
#
# 1) copy .env.example to .env and fill in every value marked 必填
# 2) docker compose up -d --build
# 3) open http://<host>/  (first run: the install wizard at /install)
#
# NOTE: this file has not been executed in the authoring environment (no Docker available there) -
# review it against your own deployment before relying on it.
services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-guyi_access}
      MYSQL_USER: ${MYSQL_USER:-guyi}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build: ./guyi-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-guyi_access}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
      DB_USERNAME: ${MYSQL_USER:-guyi}
      DB_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
      # 必填：少于 32 字节会导致后端拒绝启动
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置 JWT_SECRET（至少 32 字节）}
      API_TOKEN: ${API_TOKEN:?请在 .env 中设置 API_TOKEN}
      # 可选：设置后安装接口必须携带 install_token
      INSTALL_TOKEN: ${INSTALL_TOKEN:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      # nginx 在容器内代理 /api，因此信任其转发的 X-Forwarded-For 末段
      TRUST_PROXY: "true"
      TZ: Asia/Shanghai
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build: ./guyi-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"

volumes:
  mysql_data:

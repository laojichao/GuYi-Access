server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The Vue app uses history-mode routing: any unknown path must fall through to index.html,
    # otherwise a refresh on /cards would 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy to the backend container. Set TRUST_PROXY=true on the backend so it reads
    # X-Forwarded-For; nginx appends the real client address at the END of that list, which is the
    # entry the backend trusts (earlier entries can be forged by the client).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # System migration uploads a JSON file (multipart limit on the backend is 50 MB)
        proxy_read_timeout 120s;
        client_max_body_size 64m;
    }
}

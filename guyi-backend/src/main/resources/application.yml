server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/guyi_access?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# Application settings - all secrets MUST be provided via environment variables
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 259200000  # 3 days in milliseconds
  admin:
    default-username: GuYi
  api-token: ${API_TOKEN}
  rate-limit:
    max-requests: 60
    login-max-requests: 5
    window-seconds: 60
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  trust-proxy: ${TRUST_PROXY:false}
